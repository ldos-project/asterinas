# Standalone userspace tool, its own workspace root so it isn't swept into the root workspace.
[workspace]

[package]
name = "oqbench_server"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

[[bin]]
name = "oqbench_server"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4.17", features = ["derive"] }
minicbor = { version = "2.2.2", features = ["std"] }
minicbor-serde = { version = "0.6", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
snafu = "0.8"

