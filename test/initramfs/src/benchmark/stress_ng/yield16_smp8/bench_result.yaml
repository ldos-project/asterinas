alert:
  bigger_is_better: true
  threshold: 130%
chart:
  description: stress-ng --yield 16 -t 60s
  legend: Bogo ops/s of stress-ng yield on {system}
  title: '[Scheduler] stress-ng yield, 16 sched_yield workers on 8 CPUs'
  unit: bogo ops/sec
result_extraction:
  result_index: 9
  search_pattern: 'metrc: \[[0-9]+\] yield '
runtime_config:
  smp: 8
