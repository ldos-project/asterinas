# This crate is not part of the main Asterinas Cargo workspace (see the root `Cargo.toml`); it is
# a standalone host/userspace tool built by `test/initramfs/nix/raid-policy-server.nix` and copied
# into the initramfs. `[workspace]` here makes it its own workspace root so it isn't accidentally
# swept into the root workspace (matches `test/nixos/Cargo.toml`).
[workspace]

[package]
name = "raid_policy_server"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

[[bin]]
name = "raid_policy_server"
path = "src/main.rs"

[dependencies]
# Both ends of the OQFS wire format declare their messages with `serde` derive and encode/decode
# through `minicbor-serde`; `minicbor` is used directly only for stream framing (probing how many
# bytes one complete CBOR record occupies), matching `produce_cbor` in
# `ostd/src/orpc/oqueue/export.rs`. Versions match the root workspace's pins.
minicbor = { version = "2.2", features = ["std"] }
minicbor-serde = { version = "0.6", features = ["std"] }
serde = { version = "1.0.192", features = ["derive"] }
