# The loop settings every search starts from. A search config (`subsystems/<name>/configs/*.yaml`)
# overrides any of them in its `loop:` block; what only its subsystem understands goes in `params:`.
backend: openai
model: gpt-6-luna
reasoning_effort: high
benchmark_repeats: 3
max_turns: 20
max_total_tokens: 20000000
max_tokens_per_turn: 2000000
enable_benchmark_tool: true
max_benchmarks_per_turn: 8
