# howdone configuration for benchmark runs driven by act.

prefix: run
output_file: act.log
output_dir:
  variable: OUTPUT_DIR
commands:
  hostname: hostname
  git_state.txt: git status; git log -n 3
  dirty.diff: git diff --stat --patch HEAD
  ps-ax.txt:
    command: ps ax
    when: before
  lsblk.txt: lsblk
  mount.txt: mount
  uname-all.txt: uname --all
  lscpu.txt: lscpu
  env.txt: env

  # What actually ran the benchmarks
  act-version.txt: act --version
  docker-version.txt: docker version
  image.txt: cat DOCKER_IMAGE_VERSION

  # Collect every benchmark artifact the sweep left in the repository root.
  collected.txt: |
    for f in result_*.json \
             aster_output_*.txt linux_output_*.txt \
             aster_guest_*.log linux_guest_*.log; do
        [ -e "$f" ] && mv "$f" "$OUTPUT_DIR/"
    done
    ls -lh "$OUTPUT_DIR"
